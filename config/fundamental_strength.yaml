  macro_events_path: data/reference/macro_release_events.csv
  yields_path: data/reference/two_year_yields.csv

scoring:
  yield_lookback_observations: 20
  yield_deadband_pct: 0.10
  primary_bias_threshold: 2
  weighted_bias_threshold: 3
  robustness_weights:
